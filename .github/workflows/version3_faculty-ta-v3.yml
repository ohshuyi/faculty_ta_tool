# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - faculty-ta-v3


on:
  push:
    branches:
      - version3
  workflow_dispatch:

env:
  APPLICATION_PUBLISH_PROFILE: ${{ secrets.APP_PUBLISH_PROFILE_V3 }}
  WEBAPP_NAME: "faculty-ta-v3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install
        run: npm install

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      # - name: npm run test
        
      #   run: 
      #     npm run test --if-present
      
      # - name: Build Next.js App
      #   run: npm run build
  
      # - name: Organize build output
      #   run: |
      #     mv ./build/static ./build/standalone/build
      #     mv ./public ./build/standalone

      # - name: Zip artifact for deployment
      #   run: zip release.zip ./* -r

      # - name: Upload artifact fsor deployment job
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: node-app
      #     path: ./build/standalone/
      - name: npm build and test
        env:
              DATABASE_URL: ${{ secrets.DATABASE_URL_V3 }}
        run: |
          npm run build --if-present
          npm run test --if-present

      - name: Zip artifact for deployment
        run: zip next.zip ./* .next -qr

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: next.zip
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'v3'
      url: https://faculty-ta-v3.azurewebsites.net

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip next.zip
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'faculty-ta-v3'
          slot-name: 'Production'
          publish-profile: ${{ secrets.APP_PUBLISH_PROFILE_V3 }}
          package: .

